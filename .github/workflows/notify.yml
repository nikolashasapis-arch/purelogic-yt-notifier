name: youtube uploads to discord
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "send a test message to each uploads channel"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: notify
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 notify.py
        env:
          WEBHOOKS: ${{ secrets.WEBHOOKS }}
          TEST: ${{ inputs.test }}
      - run: |
          git config user.name "upload-bot"
          git config user.email "upload-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update seen videos" && git pull --rebase -q && git push)
